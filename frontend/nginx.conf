server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Массовая загрузка принимает до 64 МБ (app/batch.py, MAX_BYTES): nginx по умолчанию режет на 1 МБ.
    client_max_body_size 65m;

    # Адрес api — через DNS Docker на каждый запрос (не дольше 10 с): после перезапуска api у него
    # новый IP, а имя в proxy_pass nginx разрешает один раз при старте и отвечал бы 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
