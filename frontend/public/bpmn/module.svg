<path d="M1330 450 L1330 22 L820 22 L820 55" fill="none" stroke="#17191c" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1075" y="16" fill="#5b616a" font-size="11" text-anchor="middle">нет: вернуть с замечаниями</text>
<circle cx="140" cy="95" r="18" fill="#ffffff" stroke="#17191c" stroke-width="1.5"/>
<text x="140" y="129" text-anchor="middle" fill="#17191c">Нужна новая СТЕ</text>
<polygon points="310,70 335,95 310,120 285,95" fill="#ffe98f" stroke="#17191c" stroke-width="1.2"/>
<text x="310" y="100" text-anchor="middle" fill="#17191c" font-size="16">×</text>
<text x="310" y="60" text-anchor="middle" fill="#17191c">Один товар или файл?</text>
<rect x="410" y="55" width="140" height="80" rx="8" fill="#ffffff" stroke="#17191c" stroke-width="1.2"/>
<text x="480" y="92" text-anchor="middle" fill="#17191c">Ввести наименование</text>
<text x="480" y="106" text-anchor="middle" fill="#17191c">и описание</text>
<rect x="240" y="245" width="140" height="80" rx="8" fill="#ffffff" stroke="#17191c" stroke-width="1.2"/>
<text x="310" y="268" text-anchor="middle" fill="#17191c">Разобрать файл:</text>
<text x="310" y="282" text-anchor="middle" fill="#17191c">строки порциями</text>
<text x="310" y="296" text-anchor="middle" fill="#17191c">через очередь</text>
<text x="310" y="310" text-anchor="middle" fill="#17191c">воркерам</text>
<rect x="410" y="245" width="140" height="80" rx="8" fill="#ffffff" stroke="#17191c" stroke-width="1.2"/>
<text x="480" y="261" text-anchor="middle" fill="#17191c">Найти категорию и</text>
<text x="480" y="275" text-anchor="middle" fill="#17191c">КТРУ, заполнить из</text>
<text x="480" y="289" text-anchor="middle" fill="#17191c">текста и СТЕ</text>
<text x="480" y="303" text-anchor="middle" fill="#17191c">портала (без модели</text>
<text x="480" y="317" text-anchor="middle" fill="#17191c">— правилами)</text>
<polygon points="650,260 675,285 650,310 625,285" fill="#ffe98f" stroke="#17191c" stroke-width="1.2"/>
<text x="650" y="290" text-anchor="middle" fill="#17191c" font-size="16">×</text>
<text x="650" y="326" text-anchor="middle" fill="#17191c">Категория и КТРУ</text>
<text x="650" y="340" text-anchor="middle" fill="#17191c">однозначны?</text>
<rect x="580" y="55" width="140" height="80" rx="8" fill="#ffffff" stroke="#17191c" stroke-width="1.2"/>
<text x="650" y="85" text-anchor="middle" fill="#17191c">Ответить на вопрос</text>
<text x="650" y="99" text-anchor="middle" fill="#17191c">или дополнить</text>
<text x="650" y="113" text-anchor="middle" fill="#17191c">описание</text>
<rect x="750" y="55" width="140" height="80" rx="8" fill="#ffffff" stroke="#17191c" stroke-width="1.2"/>
<text x="820" y="85" text-anchor="middle" fill="#17191c">Принять или</text>
<text x="820" y="99" text-anchor="middle" fill="#17191c">поправить значения</text>
<text x="820" y="113" text-anchor="middle" fill="#17191c">и подсказки</text>
<rect x="750" y="245" width="140" height="80" rx="8" fill="#ffffff" stroke="#17191c" stroke-width="1.2"/>
<text x="820" y="275" text-anchor="middle" fill="#17191c">Проверить карточку:</text>
<text x="820" y="289" text-anchor="middle" fill="#17191c">модерация, дубли,</text>
<text x="820" y="303" text-anchor="middle" fill="#17191c">числа, опечатки</text>
<polygon points="990,260 1015,285 990,310 965,285" fill="#ffe98f" stroke="#17191c" stroke-width="1.2"/>
<text x="990" y="290" text-anchor="middle" fill="#17191c" font-size="16">×</text>
<text x="990" y="326" text-anchor="middle" fill="#17191c">Есть блокирующие</text>
<text x="990" y="340" text-anchor="middle" fill="#17191c">замечания?</text>
<rect x="1090" y="55" width="140" height="80" rx="8" fill="#ffffff" stroke="#17191c" stroke-width="1.2"/>
<text x="1160" y="92" text-anchor="middle" fill="#17191c">Отправить на</text>
<text x="1160" y="106" text-anchor="middle" fill="#17191c">модерацию</text>
<rect x="1090" y="435" width="140" height="80" rx="8" fill="#ffffff" stroke="#17191c" stroke-width="1.2"/>
<text x="1160" y="472" text-anchor="middle" fill="#17191c">Проверить заявку с</text>
<text x="1160" y="486" text-anchor="middle" fill="#17191c">замечаниями модуля</text>
<polygon points="1330,450 1355,475 1330,500 1305,475" fill="#ffe98f" stroke="#17191c" stroke-width="1.2"/>
<text x="1330" y="480" text-anchor="middle" fill="#17191c" font-size="16">×</text>
<text x="1330" y="516" text-anchor="middle" fill="#17191c">Принять заявку?</text>
<rect x="1430" y="435" width="140" height="80" rx="8" fill="#ffffff" stroke="#17191c" stroke-width="1.2"/>
<text x="1500" y="472" text-anchor="middle" fill="#17191c">Опубликовать СТЕ в</text>
<text x="1500" y="486" text-anchor="middle" fill="#17191c">каталоге</text>
<circle cx="1670" cy="475" r="18" fill="#ffffff" stroke="#17191c" stroke-width="3.5"/>
<text x="1670" y="509" text-anchor="middle" fill="#17191c">СТЕ в каталоге</text>
</svg>
